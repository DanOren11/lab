apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: my-app

spec:
  project: default

  source:
    repoURL: https://github.com/company/my-app.git
    targetRevision: HEAD
    path: helm/my-app

    helm:
      valueFiles:
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: production

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
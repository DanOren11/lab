apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: my-app

spec:
  project: default

  source:
    repoURL: https://github.com/DanOren11/lab.git
    targetRevision: HEAD
    path: Argo_cd/lab_01/helm/my-app

    helm:
      valueFiles:
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
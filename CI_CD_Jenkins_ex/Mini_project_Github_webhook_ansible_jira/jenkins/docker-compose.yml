services:
  master:
    image: jenkins/jenkins:lts
    container_name: jenkins-master
    volumes: 
      - jenkins_master_data:/var/jenkins_home
    ports:
      - "8080:8080"
      - "50000:50000"
    networks:
      - mini-project-jenkins-net

  Application-Server: 
    image: danpowercom/mini-project-jenkins-github-webhook:slave
    container_name: application-inbound-agent
    user: root
    environment:
      - JENKINS_URL=http://jenkins-master:8080
      - JENKINS_SECRET=${APPLICATION_SECRET}
      - JENKINS_AGENT_NAME=${APPLICATION_AGENT}
    volumes:
      - application_slave_data:/home/jenkins/agent
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - mini-project-jenkins-net

  Infrastructure-Server: 
    image: danpowercom/mini-project-jenkins-github-webhook:slave
    container_name: infrastructure-inbound-agent
    user: root
    environment:
      - JENKINS_URL=http://jenkins-master:8080
      - JENKINS_SECRET=${INFRASTRUCTURE_SECRET}
      - JENKINS_AGENT_NAME=${INFRASTRUCTURE_AGENT}
    volumes:
      - infrastructure_slave_data:/home/jenkins/agent
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - mini-project-jenkins-net

